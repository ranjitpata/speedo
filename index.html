<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="description" content="Real-time Speedometer and Trip Cost Tracker">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>SpeedoTrack - PWA Speedometer</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Web App Manifest (Inline Data URI) -->
    <link rel="manifest" href='data:application/manifest+json;base64,eyJuYW1lIjoiU3BlZWRvVHJhY2siLCJzaG9ydF9uYW1lIjoiU3BlZWRvIiwiZGVzY3JpcHRpb24iOiJSZWFsLXRpbWUgVmVoaWNsZSBTcGVlZG9tZXRlciIsInN0YXJ0X3VybCI6Ii4iLCJkaXNwbGF5Ijoic3RhbmRhbG9uZSIsImJhY2tncm91bmRfY29sb3IiOiIjMGEwYTBhIiwidGhlbWVfY29sb3IiOiIjMGEwYTBhIiwiaWNvbnMiOlt7InNyYyI6Imh0dHBzOi8vdmlhLnBsYWNlaG9sZGVyLmNvbS8xOTIiLCJzaXplcyI6IjE5MngxOTIiLCJ0eXBlIjoiaW1hZ2UvcG5nIn1dfQ=='>

    <style>
        :root {
            --bg-color: #0a0a0a;
            --card-bg: #161616;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent: #00ff9d;
            --accent-dim: #00ff9d33;
            --danger: #ff4757;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Layout & Map --- */
        #map-container {
            flex: 1;
            position: relative;
            width: 100%;
            z-index: 1;
        }
        
        #map { height: 100%; width: 100%; }

        /* --- HUD Overlay --- */
        .hud-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(22, 22, 22, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid #333;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            z-index: 1000;
            transition: transform 0.3s ease;
            max-height: 60vh;
            overflow-y: auto;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-badge {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 4px;
            background: var(--accent-dim);
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        /* --- Speedometer --- */
        .speed-display {
            text-align: center;
            margin-bottom: 20px;
        }

        .speed-value {
            font-size: 5rem;
            font-weight: 800;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .speed-unit {
            font-size: 1.2rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .unit-toggle {
            background: none;
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-left: 10px;
        }

        /* --- Stats Grid --- */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 5px; }
        .stat-value { font-size: 1.5rem; font-weight: 600; font-variant-numeric: tabular-nums; }

        /* --- Inputs & Controls --- */
        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            background: #222;
            border: 1px solid #333;
            color: white;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        .suggestions {
            position: absolute;
            bottom: 100%;
            left: 0;
            width: 100%;
            background: #222;
            border: 1px solid #333;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 2000;
            display: none;
        }

        .suggestion-item {
            padding: 10px;
            border-bottom: 1px solid #333;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .suggestion-item:hover { background: #333; }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: opacity 0.2s;
        }

        .btn-primary { background: var(--accent); color: #000; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn:active { opacity: 0.8; }

        /* --- Summary Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            z-index: 3000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333;
        }

        .cost-input-wrapper {
            margin: 20px 0;
            text-align: left;
        }

        .total-cost-display {
            font-size: 2.5rem;
            color: var(--accent);
            font-weight: bold;
            margin: 10px 0;
        }

        /* Utility */
        .hidden { display: none !important; }
        
        /* Custom Marker */
        .vehicle-marker {
            background: var(--accent);
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
        }
    </style>
</head>
<body>

    <!-- Map Container -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- Main Dashboard -->
    <div class="hud-panel" id="dashboard">
        
        <!-- Setup View -->
        <div id="setup-view">
            <div class="hud-header">
                <span class="status-badge" id="gps-status">Waiting for GPS...</span>
                <button class="unit-toggle" id="unit-btn">KM/H</button>
            </div>

            <div class="input-group">
                <div style="display: flex; gap: 8px; margin-bottom: 5px;">
                    <input type="text" id="start-input" placeholder="Start Location (Address or GMaps link)">
                    <button class="unit-toggle" id="gps-start-btn" style="background: var(--accent); color: #000; border: none; font-weight: bold;">📍</button>
                </div>
                <div class="suggestions" id="start-suggestions"></div>
            </div>
            
            <div class="input-group">
                <input type="text" id="dest-input" placeholder="Destination (Address or GMaps link)">
                <div class="suggestions" id="dest-suggestions"></div>
            </div>

            <button class="btn btn-primary" id="start-trip-btn">Start Trip</button>
        </div>

        <!-- Active Trip View -->
        <div id="trip-view" class="hidden">
            <div class="speed-display">
                <div class="speed-value" id="speed-val">0</div>
                <div class="speed-unit"><span id="speed-unit-text">km/h</span></div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">Time Elapsed</div>
                    <div class="stat-value" id="timer-val">00:00:00</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Distance</div>
                    <div class="stat-value"><span id="dist-val">0.0</span> <span style="font-size:0.8rem">km</span></div>
                </div>
            </div>

            <button class="btn btn-danger" id="end-trip-btn">End Trip</button>
        </div>
    </div>

    <!-- Summary Modal -->
    <div class="modal-overlay" id="summary-modal">
        <div class="modal-content">
            <h2>Trip Complete</h2>
            <div class="stats-grid" style="margin-top: 20px;">
                <div class="stat-card">
                    <div class="stat-label">Total Distance</div>
                    <div class="stat-value"><span id="final-dist">0</span> km</div>
                </div>
                <div class="stat-label">Total Time</div>
                <div class="stat-value" id="final-time">00:00:00</div>
            </div>

            <div class="cost-input-wrapper">
                <label class="stat-label">Cost per Meter ($)</label>
                <input type="number" id="cost-per-meter" step="0.0001" value="0.002" placeholder="e.g. 0.002">
            </div>

            <div class="stat-label">Total Trip Cost</div>
            <div class="total-cost-display" id="total-cost">$0.00</div>

            <button class="btn btn-primary" onclick="location.reload()">New Trip</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <script>
        /**
         * SERVICE WORKER REGISTRATION
         * Inline Blob strategy for single-file portability
         */
        const swCode = `
            const CACHE_NAME = 'speedotrack-v1';
            self.addEventListener('install', e => {
                e.waitUntil(self.skipWaiting());
            });
            self.addEventListener('activate', e => {
                e.waitUntil(self.clients.claim());
            });
            self.addEventListener('fetch', e => {
                // Cache first, network fallback for map tiles and scripts
                if (e.request.url.includes('tile.openstreetmap.org') || e.request.url.includes('unpkg')) {
                    e.respondWith(
                        caches.open(CACHE_NAME).then(cache => {
                            return cache.match(e.request).then(res => {
                                return res || fetch(e.request).then(fetchRes => {
                                    return cache.put(e.request, fetchRes.clone()).then(() => fetchRes);
                                });
                            });
                        })
                    );
                } else {
                    e.respondWith(fetch(e.request));
                }
            });
        `;
        
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        const swUrl = URL.createObjectURL(swBlob);

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register(swUrl)
                .then(() => console.log('Service Worker Registered'))
                .catch(err => console.error('SW Error:', err));
        }

        /**
         * APP LOGIC
         */
        const App = {
            state: {
                isTracking: false,
                unit: 'kmh', // kmh or mph
                startTime: null,
                timerInterval: null,
                watchId: null,
                totalDistance: 0, // meters
                lastLat: null,
                lastLon: null,
                wakeLock: null,
                routeLayer: null,
                marker: null
            },

            elements: {
                map: document.getElementById('map'),
                setupView: document.getElementById('setup-view'),
                tripView: document.getElementById('trip-view'),
                summaryModal: document.getElementById('summary-modal'),
                speedVal: document.getElementById('speed-val'),
                speedUnitText: document.getElementById('speed-unit-text'),
                timerVal: document.getElementById('timer-val'),
                distVal: document.getElementById('dist-val'),
                gpsStatus: document.getElementById('gps-status'),
                startInput: document.getElementById('start-input'),
                destInput: document.getElementById('dest-input'),
                startSuggestions: document.getElementById('start-suggestions'),
                destSuggestions: document.getElementById('dest-suggestions'),
                costInput: document.getElementById('cost-per-meter'),
                totalCostDisplay: document.getElementById('total-cost'),
                finalDist: document.getElementById('final-dist'),
                finalTime: document.getElementById('final-time')
            },

            init() {
                this.initMap();
                this.setupListeners();
                this.requestPermissions();
            },

            initMap() {
                // Default view
                this.mapInstance = L.map('map', { zoomControl: false }).setView([0, 0], 2);
                
                // Dark Matter Tiles
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
                    attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
                    subdomains: 'abcd',
                    maxZoom: 19
                }).addTo(this.mapInstance);

                // Custom Vehicle Icon
                this.vehicleIcon = L.divIcon({
                    className: 'vehicle-marker',
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });
            },

            async requestPermissions() {
                // Geolocation handled on Start Trip, but we can check availability
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your browser");
                }

                // Wake Lock
                try {
                    this.state.wakeLock = await navigator.wakeLock.request('screen');
                    document.addEventListener('visibilitychange', async () => {
                        if (this.state.wakeLock !== null && document.visibilityState === 'visible') {
                            this.state.wakeLock = await navigator.wakeLock.request('screen');
                        }
                    });
                } catch (err) {
                    console.log(`${err.name}, ${err.message}`);
                }
            },

            setupListeners() {
                // Unit Toggle
                document.getElementById('unit-btn').addEventListener('click', () => {
                    this.state.unit = this.state.unit === 'kmh' ? 'mph' : 'kmh';
                    document.getElementById('unit-btn').innerText = this.state.unit === 'kmh' ? 'KM/H' : 'MPH';
                    this.elements.speedUnitText.innerText = this.state.unit === 'kmh' ? 'km/h' : 'mph';
                });

                // GPS Button for Start Location
                document.getElementById('gps-start-btn').addEventListener('click', () => {
                    this.getCurrentLocationForStart();
                });

                // Start Trip
                document.getElementById('start-trip-btn').addEventListener('click', () => this.startTrip());

                // End Trip
                document.getElementById('end-trip-btn').addEventListener('click', () => this.endTrip());

                // Cost Calculation
                this.elements.costInput.addEventListener('input', (e) => {
                    const rate = parseFloat(e.target.value) || 0;
                    const cost = this.state.totalDistance * rate;
                    this.elements.totalCostDisplay.innerText = `$${cost.toFixed(2)}`;
                });

                // Search Debounce
                const debounce = (func, delay) => {
                    let timeout;
                    return (...args) => {
                        clearTimeout(timeout);
                        timeout = setTimeout(() => func.apply(this, args), delay);
                    };
                };

                const handleSearch = (inputEl, suggestionsEl, isStart) => {
                    inputEl.addEventListener('input', debounce((e) => {
                        const query = e.target.value;
                        
                        // Check if it's a Google Maps link
                        if (query.includes('google.com/maps') || query.includes('goo.gl/maps')) {
                            this.parseGoogleMapsLink(query, inputEl, isStart);
                            suggestionsEl.style.display = 'none';
                            return;
                        }
                        
                        if (query.length < 3) {
                            suggestionsEl.style.display = 'none';
                            return;
                        }
                        this.fetchAddresses(query, suggestionsEl, inputEl, isStart);
                    }, 500));
                    
                    // Also handle paste event for Google Maps links
                    inputEl.addEventListener('paste', debounce((e) => {
                        const query = e.target.value;
                        if (query && (query.includes('google.com/maps') || query.includes('goo.gl/maps'))) {
                            this.parseGoogleMapsLink(query, inputEl, isStart);
                            suggestionsEl.style.display = 'none';
                        }
                    }, 300));
                };

                handleSearch(this.elements.startInput, this.elements.startSuggestions, true);
                handleSearch(this.elements.destInput, this.elements.destSuggestions, false);
            },

            async getCurrentLocationForStart() {
                if (!navigator.geolocation) {
                    alert("Geolocation is not supported by your browser");
                    return;
                }

                const btn = document.getElementById('gps-start-btn');
                btn.innerText = "⏳";
                btn.disabled = true;

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        const { latitude, longitude } = pos.coords;
                        this.elements.startInput.dataset.lat = latitude;
                        this.elements.startInput.dataset.lon = longitude;
                        this.elements.startInput.value = `Current Location (${latitude.toFixed(4)}, ${longitude.toFixed(4)})`;
                        btn.innerText = "📍";
                        btn.disabled = false;
                        
                        // Try to reverse geocode for a nice address
                        this.reverseGeocode(latitude, longitude, this.elements.startInput);
                        
                        // Draw route if destination is set
                        if (this.elements.destInput.dataset.lat) {
                            this.drawRoute();
                        }
                    },
                    (err) => {
                        console.error(err);
                        alert("Unable to get your current location. Please enter manually.");
                        btn.innerText = "📍";
                        btn.disabled = false;
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            },

            async reverseGeocode(lat, lon, inputEl) {
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`);
                    const data = await response.json();
                    if (data.display_name) {
                        inputEl.value = data.display_name;
                    }
                } catch (error) {
                    console.error("Reverse geocoding error", error);
                }
            },

            parseGoogleMapsLink(url, inputEl, isStart) {
                // Extract coordinates from Google Maps URL
                // Formats: 
                // https://www.google.com/maps/place/@lat,lng,zoom
                // https://www.google.com/maps?q=lat,lng
                // https://goo.gl/maps/xxxxx (shortened - requires API, fallback to regex)
                
                let lat = null, lon = null;
                
                // Pattern 1: @lat,lng
                const atPattern = /@(-?\d+\.\d+),(-?\d+\.\d+)/;
                const atMatch = url.match(atPattern);
                if (atMatch) {
                    lat = parseFloat(atMatch[1]);
                    lon = parseFloat(atMatch[2]);
                }
                
                // Pattern 2: ?q=lat,lng
                if (!lat) {
                    const qPattern = /\?q=(-?\d+\.\d+),(-?\d+\.\d+)/;
                    const qMatch = url.match(qPattern);
                    if (qMatch) {
                        lat = parseFloat(qMatch[1]);
                        lon = parseFloat(qMatch[2]);
                    }
                }
                
                // Pattern 3: !3dlat!4dlng (embedded maps)
                if (!lat) {
                    const embedPattern = /!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/;
                    const embedMatch = url.match(embedPattern);
                    if (embedMatch) {
                        lat = parseFloat(embedMatch[1]);
                        lon = parseFloat(embedMatch[2]);
                    }
                }
                
                // Pattern 4: coords after /place/ or in query
                if (!lat) {
                    const placePattern = /\/place\/.*?(-?\d+\.\d+),(-?\d+\.\d+)/;
                    const placeMatch = url.match(placePattern);
                    if (placeMatch) {
                        lat = parseFloat(placeMatch[1]);
                        lon = parseFloat(placeMatch[2]);
                    }
                }

                if (lat && lon) {
                    inputEl.dataset.lat = lat;
                    inputEl.dataset.lon = lon;
                    inputEl.value = `Google Maps Location (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                    
                    // Try to get address from OSM
                    this.reverseGeocode(lat, lon, inputEl);
                    
                    if (isStart && this.elements.destInput.dataset.lat) {
                        this.drawRoute();
                    } else if (!isStart && this.elements.startInput.dataset.lat) {
                        this.drawRoute();
                    }
                } else {
                    alert("Could not extract coordinates from this Google Maps link. Please try a different format or paste the address directly.");
                }
            },

            async fetchAddresses(query, suggestionsEl, inputEl, isStart) {
                try {
                    // Nominatim requires a unique User-Agent or Referer. 
                    // In a real app, use a proxy. Here we rely on the browser's referer.
                    const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5`);
                    const data = await response.json();
                    
                    suggestionsEl.innerHTML = '';
                    if (data.length > 0) {
                        suggestionsEl.style.display = 'block';
                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.innerText = item.display_name;
                            div.onclick = () => {
                                inputEl.value = item.display_name;
                                suggestionsEl.style.display = 'none';
                                // Store coords temporarily on the input element for retrieval
                                inputEl.dataset.lat = item.lat;
                                inputEl.dataset.lon = item.lon;
                                
                                if(isStart) this.drawRoute();
                                else this.drawRoute();
                            };
                            suggestionsEl.appendChild(div);
                        });
                    } else {
                        suggestionsEl.style.display = 'none';
                    }
                } catch (error) {
                    console.error("Geocoding error", error);
                }
            },

            async drawRoute() {
                const startLat = this.elements.startInput.dataset.lat;
                const startLon = this.elements.startInput.dataset.lon;
                const destLat = this.elements.destInput.dataset.lat;
                const destLon = this.elements.destInput.dataset.lon;

                if (!startLat || !destLat) return;

                if (this.state.routeLayer) this.mapInstance.removeLayer(this.state.routeLayer);

                try {
                    const response = await fetch(`https://router.project-osrm.org/route/v1/driving/${startLon},${startLat};${destLon},${destLat}?overview=full&geometries=geojson`);
                    const data = await response.json();
                    
                    if (data.routes && data.routes.length > 0) {
                        const route = data.routes[0].geometry;
                        this.state.routeLayer = L.geoJSON(route, {
                            style: { color: '#00ff9d', weight: 5, opacity: 0.7 }
                        }).addTo(this.mapInstance);
                        
                        this.mapInstance.fitBounds(this.state.routeLayer.getBounds(), { padding: [50, 50] });
                    }
                } catch (error) {
                    console.error("Routing error", error);
                }
            },

            startTrip() {
                if (!this.elements.startInput.value || !this.elements.destInput.value) {
                    alert("Please enter both start and destination locations.");
                    return;
                }

                this.state.isTracking = true;
                this.elements.setupView.classList.add('hidden');
                this.elements.tripView.classList.remove('hidden');
                this.elements.gpsStatus.innerText = "Acquiring Signal...";

                // Start Timer
                this.state.startTime = Date.now();
                this.state.timerInterval = setInterval(() => {
                    const delta = Math.floor((Date.now() - this.state.startTime) / 1000);
                    this.elements.timerVal.innerText = this.formatTime(delta);
                }, 1000);

                // Start Geolocation
                const options = {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                };

                this.state.watchId = navigator.geolocation.watchPosition(
                    (pos) => this.handlePositionUpdate(pos),
                    (err) => {
                        console.error(err);
                        this.elements.gpsStatus.innerText = "GPS Error";
                    },
                    options
                );
            },

            handlePositionUpdate(position) {
                const { latitude, longitude, speed } = position.coords;
                
                // Update Status
                this.elements.gpsStatus.innerText = "Tracking Active";
                this.elements.gpsStatus.style.background = "#00ff9d33";
                this.elements.gpsStatus.style.color = "#00ff9d";

                // Update Map Marker
                if (this.state.marker) {
                    this.state.marker.setLatLng([latitude, longitude]);
                } else {
                    this.state.marker = L.marker([latitude, longitude], { icon: this.vehicleIcon }).addTo(this.mapInstance);
                    this.mapInstance.setView([latitude, longitude], 16);
                }

                // Calculate Speed
                let speedVal = speed || 0; // m/s
                if (this.state.unit === 'mph') {
                    speedVal = speedVal * 2.23694;
                } else {
                    speedVal = speedVal * 3.6;
                }
                this.elements.speedVal.innerText = speedVal.toFixed(1);

                // Calculate Distance (Haversine with noise filter)
                if (this.state.lastLat !== null) {
                    const dist = this.getDistanceFromLatLonInM(
                        this.state.lastLat, this.state.lastLon,
                        latitude, longitude
                    );
                    // Filter GPS drift (< 3 meters)
                    if (dist > 3) {
                        this.state.totalDistance += dist;
                        this.elements.distVal.innerText = (this.state.totalDistance / 1000).toFixed(2);
                    }
                }

                this.state.lastLat = latitude;
                this.state.lastLon = longitude;
            },

            endTrip() {
                this.state.isTracking = false;
                
                // Stop Tracking
                clearInterval(this.state.timerInterval);
                navigator.geolocation.clearWatch(this.state.watchId);
                
                // Release Wake Lock
                if (this.state.wakeLock) {
                    this.state.wakeLock.release().then(() => this.state.wakeLock = null);
                }

                // Show Summary
                this.elements.finalDist.innerText = (this.state.totalDistance / 1000).toFixed(2);
                this.elements.finalTime.innerText = this.elements.timerVal.innerText;
                
                // Trigger initial cost calc
                const rate = parseFloat(this.elements.costInput.value) || 0;
                const cost = this.state.totalDistance * rate;
                this.elements.totalCostDisplay.innerText = `$${cost.toFixed(2)}`;

                this.elements.summaryModal.style.display = 'flex';
            },

            // Utilities
            getDistanceFromLatLonInM(lat1, lon1, lat2, lon2) {
                const R = 6371e3; // metres
                const dLat = this.toRad(lat2 - lat1);
                const dLon = this.toRad(lon2 - lon1);
                const a = 
                    Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(this.toRad(lat1)) * Math.cos(this.toRad(lat2)) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return R * c;
            },

            toRad(deg) { return deg * (Math.PI / 180); },

            formatTime(seconds) {
                const h = Math.floor(seconds / 3600).toString().padStart(2, '0');
                const m = Math.floor((seconds % 3600) / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${h}:${m}:${s}`;
            }
        };

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => App.init());

    </script>
</body>
